<!doctype html>
<meta charset="utf-8">
<title>DOMPurify</title>
<script src="purify.js"></script>

<h1>DOMPurify</h1>
<p>Input: <code id="input"></code></p>
<p>DOMPurify loaded: <b id="status"></b></p>
<p>Output: <span id="test"></span></p>

<script>

let dirty = "<img src=x onerror=alert(document.domain)>";
document.getElementById('input').textContent = dirty;
document.getElementById('status').textContent = typeof DOMPurify !== 'undefined' ? 'yes (' + DOMPurify.version + ')' : 'no';
try {
    let clean = DOMPurify.sanitize(dirty);
    test.innerHTML = clean;
} catch (e) {
    test.innerHTML = dirty;
}


</script>
